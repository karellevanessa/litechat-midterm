{% extends "base.html" %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <a class="brand" href="{% url 'home' %}">{% include "partials/logo.html" %}<span>Petal</span></a>
    <p class="muted">Understand your coursework, one question at a time. Pay per question, not per month.</p>

    {% block auth %}{% endblock %}
  </div>
</div>
{% endblock %}
